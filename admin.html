<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Flamer Tattoo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--preto:#0a0a0c;--grafite:#141419;--grafite2:#1d1d25;--linha:#2a2a35;--branco:#f5f5f7;--cinza:#a7a7b3;--roxo:#b026ff;--roxo-esc:#7c1fd1;--ok:#3ddc84;--erro:#ff5d5d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--preto);color:var(--branco);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase}
h2{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase;margin-bottom:10px}
.card{background:var(--grafite);border:1px solid var(--linha);border-radius:18px;padding:20px;margin-top:16px}
label{font-size:13px;font-weight:600;color:var(--cinza);display:block;margin:12px 0 6px}
input[type=text],input[type=email],input[type=password],select{width:100%;background:var(--grafite2);border:1px solid var(--linha);border-radius:12px;color:var(--branco);padding:12px;font-size:15px;font-family:'Inter',sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;background:linear-gradient(135deg,var(--roxo),var(--roxo-esc));color:#fff;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-linha{background:transparent;border-color:var(--linha);color:var(--branco)}
.btn-peq{width:auto;padding:8px 13px;font-size:13px;border-radius:10px}
.status{font-size:14px;margin-top:12px;min-height:20px}
.status.ok{color:var(--ok)} .status.erro{color:var(--erro)} .status.info{color:var(--cinza)}
#previa{max-width:100%;border-radius:14px;margin-top:12px;display:none}
.item{display:flex;gap:12px;align-items:center;background:var(--grafite2);border:1px solid var(--linha);border-radius:14px;padding:10px;margin-top:10px}
.item img{width:58px;height:58px;object-fit:cover;border-radius:10px;flex:none}
.item .info{flex:1;min-width:0}
.item .info b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item select{padding:7px;font-size:13px;margin-top:5px}
.item .acoes{display:flex;flex-direction:column;gap:6px}
.mini{border:1px solid var(--linha);background:var(--grafite);color:var(--branco);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--roxo)}
.oculta{opacity:.45}
.topo{display:flex;align-items:center;gap:12px}
.topo img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 16px rgba(176,38,255,.55)}
small{color:var(--cinza)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="tela-login">
    <div class="topo"><img src="fotos/logo.jpg" alt=""><h1>Painel Flamer Tattoo</h1></div>
    <div class="card">
      <p style="color:var(--cinza);font-size:14.5px">Área privada do tatuador. Entre com seu e-mail e senha:</p>
      <label>E-mail</label>
      <input type="email" id="email" autocomplete="username" value="painel@flamertattoo.com.br">
      <label>Senha</label>
      <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••">
      <div style="height:14px"></div>
      <button class="btn" id="entrar">Entrar</button>
      <div class="status erro" id="loginStatus"></div>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="tela-painel" hidden>
    <div class="topo"><img src="fotos/logo.jpg" alt=""><h1>Painel Flamer Tattoo</h1></div>
    <p style="margin-top:8px"><small>Gerencie as fotos do portfólio direto do seu aparelho. O que você publicar aparece no site pra todo mundo na hora.</small></p>

    <div class="card">
      <h2>Adicionar foto</h2>
      <label>1 · Escolher a foto</label>
      <input type="file" id="arquivo" accept="image/*">
      <img id="previa" alt="Prévia da foto">
      <label>2 · Escolher a aba</label>
      <select id="novaCat">
        <option value="blackwork">Black Work</option>
        <option value="minimalist">Minimalist</option>
        <option value="delicada">Delicada</option>
      </select>
      <label>Nome da tattoo (opcional)</label>
      <input type="text" id="novoTitulo" placeholder="Ex.: Rosa no braço">
      <div style="height:14px"></div>
      <button class="btn" id="publicar">3 · Publicar no site</button>
      <div class="status" id="pubStatus"></div>
    </div>

    <div class="card">
      <h2>Fotos do portfólio</h2>
      <div id="listas"></div>
      <div class="status" id="listaStatus"></div>
    </div>

    <p style="margin-top:18px;text-align:center">
      <a href="index.html" style="color:var(--cinza);font-size:14px">← Ver o site público</a>
      &nbsp;·&nbsp;
      <a href="#" id="sair" style="color:var(--cinza);font-size:14px">Sair</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== configuração (chaves públicas do projeto) ===== */
firebase.initializeApp({
  apiKey: 'AIzaSyA-4Xiv8qYezOFtvR5Tj5BmspnK3W9a1i0',
  authDomain: 'flamer-tattoo.firebaseapp.com',
  projectId: 'flamer-tattoo'
});
const auth = firebase.auth();
const db = firebase.firestore();
const SB_URL = 'https://jznxygfhkhzklslxawsh.supabase.co';
const SB_KEY = 'sb_publishable_l4ID1f-KR37gMGNtSg8rPQ_4c_WJaO5';
const CATS = {blackwork:'Black Work', minimalist:'Minimalist', delicada:'Delicada'};
const BASE = location.href.replace(/admin\.html.*$/, '');
const SEED = [
  {src:'fotos/bw-gato.jpg',cat:'blackwork',titulo:'Gato da sorte',w:690,h:1130},
  {src:'fotos/bw-dragao.jpg',cat:'blackwork',titulo:'Criatura alada',w:500,h:1215},
  {src:'fotos/bw-arvore.jpg',cat:'blackwork',titulo:'Árvore com raízes',w:660,h:1155},
  {src:'fotos/bw-olho.jpg',cat:'blackwork',titulo:'Coração com olho',w:610,h:1100},
  {src:'fotos/min-chapeu.jpg',cat:'minimalist',titulo:'Chapéu',w:630,h:510},
  {src:'fotos/min-taca.jpg',cat:'minimalist',titulo:'Taça de vinho',w:450,h:960},
  {src:'fotos/min-garrafa.jpg',cat:'minimalist',titulo:'Garrafa',w:480,h:730},
  {src:'fotos/min-amar.jpg',cat:'minimalist',titulo:'Escrita AMAR',w:680,h:450},
  {src:'fotos/min-letras.jpg',cat:'minimalist',titulo:'Letras',w:680,h:330},
  {src:'fotos/min-caveira.jpg',cat:'minimalist',titulo:'Caveira com chifres vermelhos',w:610,h:610},
  {src:'fotos/min-auricelis.jpg',cat:'minimalist',titulo:'Nome com sol',w:118,h:192},
  {src:'fotos/del-rosa.jpg',cat:'delicada',titulo:'Rosa no pescoço',w:290,h:360},
  {src:'fotos/del-tudopassa.jpg',cat:'delicada',titulo:'“Tudo passa” com borboleta',w:660,h:490}
];
let fotos = [];
let arquivoSel = null;
const $ = id => document.getElementById(id);
function setStatus(id, txt, cls){ const el = $(id); el.textContent = txt; el.className = 'status ' + cls; }

/* ---------- login ---------- */
auth.onAuthStateChanged(async user => {
  $('tela-login').hidden = !!user;
  $('tela-painel').hidden = !user;
  if (user) await carregar();
});
$('entrar').addEventListener('click', async () => {
  $('loginStatus').textContent = '';
  try {
    await auth.signInWithEmailAndPassword($('email').value.trim(), $('senha').value);
  } catch(e) {
    $('loginStatus').textContent = 'Não consegui entrar. Confira o e-mail e a senha.';
  }
});
$('senha').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });
$('sair').addEventListener('click', async e => { e.preventDefault(); await auth.signOut(); });

/* ---------- banco de fotos (Supabase Storage) ---------- */
function sbHeaders(extra){
  return Object.assign({'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}, extra || {});
}
async function sbUpload(nome, blob){
  const r = await fetch(SB_URL + '/storage/v1/object/fotos/' + nome, {
    method: 'POST',
    headers: sbHeaders({'Content-Type': 'image/jpeg', 'x-upsert': 'false'}),
    body: blob
  });
  if (!r.ok) throw new Error('upload ' + r.status);
  return SB_URL + '/storage/v1/object/public/fotos/' + nome;
}
async function sbDelete(nome){
  await fetch(SB_URL + '/storage/v1/object/fotos', {
    method: 'DELETE',
    headers: sbHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({prefixes: [nome]})
  });
}

/* ---------- carregar / semear ---------- */
async function carregar(){
  try {
    let snap = await db.collection('fotos').orderBy('ordem').get();
    if (snap.empty){
      const batch = db.batch();
      SEED.forEach((f, i) => {
        batch.set(db.collection('fotos').doc(), {
          url: BASE + f.src, storagePath: '', cat: f.cat, titulo: f.titulo,
          w: f.w, h: f.h, visivel: true, ordem: i
        });
      });
      await batch.commit();
      snap = await db.collection('fotos').orderBy('ordem').get();
    }
    fotos = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
    renderLista();
  } catch(e){
    setStatus('listaStatus', 'Não consegui carregar as fotos (' + e.message + ').', 'erro');
  }
}
function renderLista(){
  const div = $('listas');
  div.innerHTML = '';
  Object.keys(CATS).forEach(cat => {
    const itens = fotos.map((f,i)=>({f,i})).filter(x => x.f.cat === cat);
    const h = document.createElement('h3');
    h.style.cssText = 'margin:16px 0 4px;font-size:14px;letter-spacing:.08em;color:var(--cinza)';
    h.textContent = CATS[cat].toUpperCase() + ' (' + itens.length + ')';
    div.appendChild(h);
    if (!itens.length){
      const p = document.createElement('p');
      p.innerHTML = '<small>Nenhuma foto nesta aba.</small>';
      div.appendChild(p);
    }
    itens.forEach(({f, i}) => {
      const el = document.createElement('div');
      el.className = 'item' + (f.visivel === false ? ' oculta' : '');
      el.innerHTML =
        '<img src="' + f.url + '" alt="">' +
        '<div class="info"><b>' + f.titulo + '</b>' +
        '<select data-cat="' + i + '">' +
          Object.keys(CATS).map(c => '<option value="' + c + '"' + (c === f.cat ? ' selected' : '') + '>' + CATS[c] + '</option>').join('') +
        '</select></div>' +
        '<div class="acoes">' +
          '<button class="mini" data-mover="' + i + '|-1">↑</button>' +
          '<button class="mini" data-mover="' + i + '|1">↓</button>' +
        '</div>' +
        '<div class="acoes">' +
          '<button class="mini" data-vis="' + i + '">' + (f.visivel === false ? 'Mostrar' : 'Ocultar') + '</button>' +
          '<button class="mini" data-del="' + i + '">Excluir</button>' +
        '</div>';
      div.appendChild(el);
    });
  });
  div.querySelectorAll('[data-cat]').forEach(s => s.addEventListener('change', async () => {
    const i = +s.dataset.cat;
    fotos[i].cat = s.value;
    await gravar(fotos[i], 'Categoria trocada ✅');
  }));
  div.querySelectorAll('[data-mover]').forEach(b => b.addEventListener('click', async () => {
    const [i, d] = b.dataset.mover.split('|').map(Number);
    const cat = fotos[i].cat;
    const grupo = fotos.map((f,j)=>({f,j})).filter(x => x.f.cat === cat);
    const pos = grupo.findIndex(x => x.j === i);
    const alvo = grupo[pos + d];
    if (!alvo) return;
    const a = fotos[i], c = fotos[alvo.j];
    const tmp = a.ordem; a.ordem = c.ordem; c.ordem = tmp;
    setStatus('listaStatus', 'Salvando…', 'info');
    try {
      const batch = db.batch();
      batch.update(db.collection('fotos').doc(a.id), {ordem: a.ordem});
      batch.update(db.collection('fotos').doc(c.id), {ordem: c.ordem});
      await batch.commit();
      fotos.sort((x,y) => x.ordem - y.ordem);
      renderLista();
      setStatus('listaStatus', 'Ordem salva ✅', 'ok');
    } catch(e){ setStatus('listaStatus', 'Erro ao salvar (' + e.message + ').', 'erro'); }
  }));
  div.querySelectorAll('[data-vis]').forEach(b => b.addEventListener('click', async () => {
    const i = +b.dataset.vis;
    fotos[i].visivel = fotos[i].visivel === false ? true : false;
    await gravar(fotos[i], fotos[i].visivel ? 'Foto visível no site ✅' : 'Foto oculta do site ✅');
  }));
  div.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    const i = +b.dataset.del;
    const f = fotos[i];
    if (b.dataset.conf !== '1'){
      b.dataset.conf = '1';
      b.textContent = 'Confirmar exclusão?';
      setStatus('listaStatus', 'Toque em "Confirmar exclusão?" pra apagar "' + f.titulo + '" de vez.', 'info');
      return;
    }
    setStatus('listaStatus', 'Excluindo…', 'info');
    try {
      if (f.storagePath) await sbDelete(f.storagePath);
      await db.collection('fotos').doc(f.id).delete();
      fotos.splice(i, 1);
      renderLista();
      setStatus('listaStatus', 'Foto excluída ✅', 'ok');
    } catch(e){ setStatus('listaStatus', 'Erro ao excluir (' + e.message + ').', 'erro'); }
  }));
}
async function gravar(f, okMsg){
  setStatus('listaStatus', 'Salvando…', 'info');
  try {
    const {id, ...dados} = f;
    await db.collection('fotos').doc(id).update(dados);
    fotos.sort((x,y) => x.ordem - y.ordem);
    renderLista();
    setStatus('listaStatus', okMsg, 'ok');
  } catch(e){ setStatus('listaStatus', 'Erro ao salvar (' + e.message + ').', 'erro'); }
}

/* ---------- adicionar foto ---------- */
$('arquivo').addEventListener('change', () => {
  arquivoSel = $('arquivo').files[0] || null;
  if (arquivoSel){
    $('previa').src = URL.createObjectURL(arquivoSel);
    $('previa').style.display = 'block';
  }
});
function prepararImagem(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      let w = img.width, h = img.height;
      const escala = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * escala); h = Math.round(h * escala);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve({blob: b, w, h}), 'image/jpeg', 0.88);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$('publicar').addEventListener('click', async () => {
  if (!arquivoSel){ setStatus('pubStatus', 'Escolha uma foto primeiro.', 'erro'); return; }
  const btn = $('publicar');
  btn.disabled = true;
  try {
    setStatus('pubStatus', 'Preparando a foto…', 'info');
    const img = await prepararImagem(arquivoSel);
    const nome = 'foto-' + Date.now() + '.jpg';
    setStatus('pubStatus', 'Enviando a foto…', 'info');
    const url = await sbUpload(nome, img.blob);
    const titulo = $('novoTitulo').value.trim() || 'Nova tattoo';
    const ordem = fotos.length ? Math.max.apply(null, fotos.map(f => f.ordem || 0)) + 1 : 0;
    setStatus('pubStatus', 'Atualizando o site…', 'info');
    const ref = await db.collection('fotos').add({
      url, storagePath: nome, cat: $('novaCat').value, titulo,
      w: img.w, h: img.h, visivel: true, ordem
    });
    fotos.push({id: ref.id, url, storagePath: nome, cat: $('novaCat').value, titulo, w: img.w, h: img.h, visivel: true, ordem});
    arquivoSel = null; $('arquivo').value = ''; $('previa').style.display = 'none'; $('novoTitulo').value = '';
    renderLista();
    setStatus('pubStatus', 'Publicada ✅ Já está no site, na aba escolhida.', 'ok');
  } catch(e){
    setStatus('pubStatus', 'Erro ao publicar (' + e.message + '). Tente de novo.', 'erro');
  }
  btn.disabled = false;
});
</script>
</body>
</html>
